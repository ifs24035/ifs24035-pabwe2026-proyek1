<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link
      rel="preload"
      as="image"
      href="/logo-64.webp"
      imagesrcset="/logo-64.webp 64w, /logo-128.webp 128w"
      imagesizes="64px"
      type="image/webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LapoTa - warung digital hasil bumi dan UMKM khas Toba" />
    <title>LapoTa - Warung Digital Khas Toba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body class="bg-cream text-stone-900 font-sans antialiased min-h-screen">
    <div id="app">
      <!-- Tampilan awal: ada <main> dan <h1> sejak byte pertama, diganti Vue setelah rute siap -->
      <main class="flex min-h-screen flex-col items-center justify-center gap-3 px-4 text-center">
        <img
          src="/logo-64.webp"
          srcset="/logo-64.webp 64w, /logo-128.webp 128w"
          sizes="64px"
          width="64"
          height="64"
          alt=""
          fetchpriority="high"
        />
        <h1 class="font-display text-2xl font-bold text-ulos-700">LapoTa</h1>
        <p class="text-sm text-stone-600">Memuat warung digital khas Toba...</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
